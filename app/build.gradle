plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.mariofronza.face_collection_app'
    compileSdk = 37

    defaultConfig {
        applicationId = "com.mariofronza.face_collection_app"
        minSdk = 24
        targetSdk = 36
        versionCode = (project.findProperty("versionCode") ?: "1") as int
        versionName = project.findProperty("versionName") ?: "1.0"

        buildConfigField "String", "API_URL", "\"${project.findProperty("apiUrl") ?: "http://10.0.2.2:3333/"}\""

        ndk {
            // Release builds pass -Pabis=arm64-v8a,armeabi-v7a; x86_64 only matters for the emulator.
            abiFilters.addAll((project.findProperty("abis") ?: "arm64-v8a,armeabi-v7a,x86_64").split(","))
        }
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    // Release signing comes from the environment so the keystore never lands in the repo.
    def keystore = System.getenv("SIGNING_KEYSTORE")
    if (keystore) {
        signingConfigs {
            release {
                storeFile = file(keystore)
                storePassword = System.getenv("SIGNING_STORE_PASSWORD")
                keyAlias = System.getenv("SIGNING_KEY_ALIAS")
                keyPassword = System.getenv("SIGNING_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            manifestPlaceholders = [usesCleartextTraffic: "true"]
        }
        release {
            if (keystore) signingConfig = signingConfigs.release
            minifyEnabled = false
            manifestPlaceholders = [usesCleartextTraffic: "false"]
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation 'androidx.fragment:fragment-ktx:1.9.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.10.2'
    implementation 'androidx.navigation:navigation-ui-ktx:2.10.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.11.0'

    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.squareup.okhttp3:okhttp:5.5.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'com.github.bumptech.glide:glide:5.0.9'

    implementation 'org.opencv:opencv:4.14.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver3:5.5.1'
    testImplementation 'org.json:json:20260814'
}
